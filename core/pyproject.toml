[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open2nec"
version = "0.1.0"
description = "Bibliothèque Python pour la simulation d'antennes NEC-2 via OpenNEC (onec)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
optim = ["scipy>=1.11"]
dev = ["pytest>=8", "ruff", "scipy>=1.11", "numpy>=1.24"]

[project.scripts]
open2nec = "open2nec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["open2nec"]
