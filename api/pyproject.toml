[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open2nec-api"
version = "0.1.0"
description = "API FastAPI au-dessus du core Open2Nec"
requires-python = ">=3.10"
dependencies = ["open2nec[optim]", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["app", "open2nec"]
